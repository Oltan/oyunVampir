<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Köy — herkes kendi telefonundan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#12152B; --night-2:#1B2043; --night-3:#272E5C;
    --madder:#B4352F; --ochre:#D3A03A; --wool:#EDE4D0; --wool-dim:#9A94A8;
    --sage:#5E8A66; --line:rgba(237,228,208,.14);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--night);color:var(--wool);font-family:Karla,system-ui,sans-serif;
       font-size:16px;line-height:1.45;padding:0 0 40px}
  h1,h2,.display{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0}
  button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
  input{font-family:inherit;font-size:16px}
  .wrap{max-width:560px;margin:0 auto;padding:18px 16px}
  .card{background:var(--night-2);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
  .card.accent{border-left:3px solid var(--ochre)}
  .muted{color:var(--wool-dim);font-size:14px}
  .btn{background:var(--night-3);border:1px solid var(--line);border-radius:11px;padding:13px 16px;
       font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--ochre);color:#20180A;border-color:transparent}
  .btn.danger{background:var(--madder);color:#fff;border-color:transparent}
  .btn.ghost{background:none}
  .btn.full{width:100%}
  .btn.sm{padding:8px 12px;font-size:14px;border-radius:9px;font-weight:500}
  .btn:disabled{opacity:.4}
  .btn:focus-visible,input:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
  input[type=text]{width:100%;background:var(--night);border:1px solid var(--line);color:var(--wool);
                   border-radius:10px;padding:12px}
  .code{font-family:Fraunces;font-weight:900;font-size:46px;letter-spacing:.12em;line-height:1}
  .big{font-family:Fraunces;font-weight:900;font-size:34px;line-height:1.05}
  .clock{font-family:Fraunces;font-weight:900;font-size:50px;line-height:1;font-variant-numeric:tabular-nums}
  .clock.low{color:var(--madder)}
  .plist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media(max-width:390px){.plist{grid-template-columns:1fr}}
  .p{background:var(--night-2);border:1px solid var(--line);border-radius:11px;padding:11px 12px;
     text-align:left;width:100%;display:block}
  .p b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .p small{color:var(--wool-dim);font-size:12px}
  .p.dead{opacity:.42} .p.dead b{text-decoration:line-through;text-decoration-color:var(--madder)}
  .p.sel{border-color:var(--ochre);background:var(--night-3)}
  .p.ok{border-color:var(--sage)}
  .row{display:flex;gap:10px;align-items:center}
  .row.wrapr{flex-wrap:wrap}
  .spacer{flex:1}
  .pill{display:inline-block;font-size:12px;padding:3px 9px;border-radius:20px;background:var(--night-3);
        color:var(--wool-dim);margin:0 5px 5px 0}
  .tally{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;font-weight:700;padding:8px 0 0}
  .hidden{display:none}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--sage);margin-right:6px}
  .dot.off{background:var(--wool-dim);opacity:.5}
  .err{color:var(--madder);font-size:14px;margin-top:8px}
  .emb{width:78px;height:78px;flex:none}
  .emb.s{width:34px;height:34px}
  .emb svg{width:100%;height:100%;display:block}
  .rolehead{display:flex;gap:14px;align-items:center}
  .rolerow{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
  .rolerow:last-child{border-bottom:0}
  .rolerow .tx{flex:1;min-width:0}
  .rolerow .tx b{display:block}
  .bar{height:6px;background:var(--night-3);border-radius:4px;overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;background:var(--ochre);transition:width .3s}
  .voters{font-size:12px;color:var(--wool-dim);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  ol{padding-left:20px;margin:8px 0 0} ol li{margin-bottom:8px;font-size:14px;color:var(--wool-dim)}
</style>

<div class="wrap" id="app"></div>

<script>
/* ===================== ROLES ===================== */
const ROLES = {
  gulyabani:{n:'Gulyabani', t:'bad',  act:'kill',  team:1, d:'Gece bir dostu yersin. Diğer gulyabanileri görürsün.'},
  dost:     {n:'Dost',      t:'good', act:'none',  d:'Gece aksiyonun yok. Gündüz konuş, şüphelen, oy ver.'},
  sifaci:   {n:'Şifacı',    t:'good', act:'heal',  d:'Her gece bir kişiyi ölümden korursun.'},
  bekci:    {n:'Bekçi',     t:'good', act:'check', d:'Seçtiğin kişinin gulyabani olup olmadığını öğrenirsin.'},
  gozcu:    {n:'Gözcü',     t:'good', act:'watch', d:'Seçtiğin kişiyi o gece kimlerin ziyaret ettiğini görürsün.'},
  uyurgezer:{n:'Uyurgezer', t:'good', act:'watch', d:'Seçtiğin kişinin gece dışarı çıkıp çıkmadığını öğrenirsin.'},
  avci:     {n:'Avcı',      t:'good', act:'kill',  d:'Gece birini vurursun. Masum vurursan vicdanın seni bitirir.'},
  koruma:   {n:'Koruma',    t:'good', act:'guard', d:'Koruduğun kişiye saldırı olursa o kurtulur, saldırgan ve sen ölürsün.'},
  tirsak:   {n:'Tırsak',    t:'good', act:'vest',  d:'Dolaba saklanırsın: o gece ölmezsin ama hiçbir şey göremezsin.'},
  medyum:   {n:'Medyum',    t:'good', act:'none',  d:'Ölülerle konuşursun. Gündüz onların dediklerini aktarabilirsin.'},
  sakaci:   {n:'Şakacı',    t:'solo', act:'none',  d:'Asılırsan kazanırsın. Herkesi sana oy vermeye ikna et.'},
  hayatta:  {n:'Hayatta Kalan', t:'solo', act:'vest', d:'Tek amacın sağ kalmak. Gece kendini koruyabilirsin.'},
  serikatil:{n:'Seri Katil',t:'solo', act:'kill',  d:'Tek başınasın. Her gece birini öldürürsün.'},
};
const PRESETS = {
  ilk:   {label:'İlk oyun',  fixed:{sifaci:1,bekci:1,avci:1,gozcu:1,uyurgezer:1}, filler:'dost', badRate:.2},
  genis: {label:'Geniş',     fixed:{sifaci:1,bekci:1,avci:1,gozcu:1,uyurgezer:1,tirsak:1,koruma:1,medyum:1,sakaci:1,hayatta:1}, filler:'dost', badRate:.2},
  sert:  {label:'Sert',      fixed:{sifaci:1,bekci:1,avci:2,gozcu:1,uyurgezer:1,koruma:1,medyum:1,sakaci:1,hayatta:1,serikatil:1}, filler:'dost', badRate:.22},
};


/* ===================== EMBLEMS =====================
   Kilim ve ağaç baskı hissi: kalın tek çizgi, geometrik, tek renk. */
const E=(b)=>`<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.4"
  stroke-linecap="round" stroke-linejoin="round">${b}</svg>`;
const EMB={
  gulyabani:E(`<path d="M12 22c0-6 9-10 20-10s20 4 20 10c0 14-8 30-20 30S12 36 12 22Z"/>
    <path d="M12 22 6 12l9 3M52 22l6-10-9 3"/><circle cx="24" cy="27" r="2.6" fill="currentColor"/>
    <circle cx="40" cy="27" r="2.6" fill="currentColor"/><path d="M23 39h18l-3 4h-12Z"/>`),
  dost:E(`<path d="M32 10 12 26v26h40V26Z"/><path d="M26 52V38h12v14"/><path d="M8 28 32 9l24 19"/>`),
  sifaci:E(`<path d="M20 28h24l-3 20a4 4 0 0 1-4 4H27a4 4 0 0 1-4-4Z"/><path d="M16 28h32"/>
    <path d="M32 12v10M27 17h10"/>`),
  bekci:E(`<path d="M24 14h16l-3 8h-10Z"/><path d="M21 22h22l3 26H18Z"/><path d="M32 8v6"/>
    <circle cx="32" cy="35" r="6"/>`),
  gozcu:E(`<path d="M6 32c8-11 17-16 26-16s18 5 26 16c-8 11-17 16-26 16S14 43 6 32Z"/>
    <circle cx="32" cy="32" r="8"/><circle cx="32" cy="32" r="2.6" fill="currentColor"/>`),
  uyurgezer:E(`<path d="M44 10a22 22 0 1 0 10 28 17 17 0 0 1-10-28Z"/>
    <path d="M18 34c2-3 5-3 7 0M31 38c2-3 5-3 7 0"/>`),
  avci:E(`<path d="M18 8c14 6 22 14 28 24-10 6-20 12-28 24"/><path d="M18 8v48"/>
    <path d="M12 32h34"/><path d="M40 26l8 6-8 6"/>`),
  koruma:E(`<path d="M32 8 12 16v16c0 12 9 20 20 24 11-4 20-12 20-24V16Z"/><path d="M24 32l6 6 12-12"/>`),
  tirsak:E(`<path d="M14 10h36v44H14Z"/><path d="M32 10v44"/><circle cx="27" cy="32" r="1.8" fill="currentColor"/>
    <circle cx="37" cy="32" r="1.8" fill="currentColor"/>`),
  medyum:E(`<path d="M32 8c4 5 4 8 0 11-4-3-4-6 0-11Z"/><path d="M26 22h12v24H26Z"/>
    <path d="M20 52h24"/><path d="M32 19v3"/>`),
  sakaci:E(`<path d="M32 20c-9 0-16 6-16 14s7 14 16 14 16-6 16-14-7-14-16-14Z"/>
    <path d="M20 22 12 8l10 5M44 22l8-14-10 5"/><circle cx="14" cy="10" r="3"/><circle cx="50" cy="10" r="3"/>
    <path d="M24 40c5 4 11 4 16 0"/>`),
  hayatta:E(`<path d="M16 26h32l-3 28H19Z"/><path d="M24 26v-6a8 8 0 0 1 16 0v6"/><path d="M16 36h32"/>`),
  serikatil:E(`<path d="M40 8 24 40h12l4-32Z"/><path d="M22 40h18l-3 8H25Z"/><path d="M31 48v10"/>`),
};
const TEAMCOL={bad:'var(--madder)',good:'var(--sage)',solo:'var(--ochre)'};
const TEAMNM ={bad:'Gulyabaniler',good:'Dostlar',solo:'Kendi başına'};

/* ===================== RULES TEXT ===================== */
const RULES_HTML = `
  <h2 style="font-size:17px">Fazlar</h2>
  <ol>
    <li><b>Gece</b>: Gece aksiyonu olan roller kendi hedefini kendi telefonundan seçer. Aksiyonu olmayanlar (Dost, Medyum, Şakacı) bekler.</li>
    <li><b>Sabah</b>: Moderatör "Sabahı getir"e basınca o gecenin bütün seçimleri birlikte çözülür.</li>
    <li><b>Gündüz</b>: Herkes tartışır, sonra herkes telefonundan asılacak kişiye oy verir; moderatör uygun gördüğü kişiyi asar.</li>
    <li>Ölen/asılan kimse konuşmaz, mimik yapmaz — ekranını izlemeye devam edebilir.</li>
  </ol>
  <h2 style="font-size:17px;margin-top:14px">Gece çözüm sırası</h2>
  <ul style="padding-left:20px;margin:8px 0 0;color:var(--wool-dim);font-size:14px">
    <li>Şifacı'nın koruduğu kişi o gece hiçbir saldırıdan ölmez.</li>
    <li>Koruma'nın koruduğu kişiye saldırı olursa hedef kurtulur — ama saldırgan da, Koruma'nın kendisi de o gece ölür.</li>
    <li>Tırsak ve Hayatta Kalan kendini sakladığında o gece ölmez ama hiçbir şey öğrenmez.</li>
    <li>Avcı gulyabani olmayan (masum) birini vurursa kurbanı ölür, vicdan azabıyla Avcı da ölür.</li>
    <li>Gulyabaniler o gece en çok oy aldıkları tek hedefte buluşup onu yer.</li>
  </ul>
  <h2 style="font-size:17px;margin-top:14px">Kazanma şartları</h2>
  <ul style="padding-left:20px;margin:8px 0 0;color:var(--wool-dim);font-size:14px">
    <li><b>Dostlar</b>: Bütün gulyabaniler ölünce kazanır.</li>
    <li><b>Gulyabaniler</b>: Sayıları dostlara eşitlenince veya geçince kazanır.</li>
    <li><b>Şakacı</b>: Gündüz asılırsa anında kazanır.</li>
    <li><b>Seri Katil</b>: Gulyabani ve Dost takımlarının hepsi bitince (Hayatta Kalan'la baş başa kalsa bile) kazanır.</li>
    <li><b>Hayatta Kalan</b>: Oyun sonuna kadar hayatta kalırsa, oyunu kim kazanırsa kazansın o da kazanmış sayılır.</li>
  </ul>`;
let showRules=false;
function toggleRules(){ showRules=!showRules; lastKey=''; draw(); }
function rulesCard(){
  if(!showRules) return '';
  return `<div class="card">
    <div class="row"><h2 style="font-size:17px">Oyun kuralları</h2><span class="spacer"></span>
      <button class="btn sm ghost" onclick="toggleRules()">Kapat</button></div>
    ${RULES_HTML}
  </div>`;
}

/* ===================== TINY FIREBASE REST CLIENT ===================== */
let DB='', ROOM='', ME={pid:null,name:''}, HOST=false, room=null, poll=null, busy=false;
const j = o => JSON.stringify(o);
async function api(path, method='GET', body){
  const url = DB.replace(/\/$/,'') + path + '.json';
  const opt = {method};
  if(body!==undefined) opt.body = j(body);
  const r = await fetch(url, opt);
  if(!r.ok) throw new Error('Bağlantı hatası ('+r.status+')');
  return r.json();
}
const rid = n => Array.from({length:n},()=>'ABCDEFGHJKLMNPRSTUVYZ'[Math.floor(Math.random()*21)]).join('');

/* ===================== URL STATE ===================== */
function readHash(){
  const h=new URLSearchParams(location.hash.slice(1));
  DB=h.get('db')||''; ROOM=h.get('room')||'';
  ME.pid=h.get('pid')||null; HOST=h.get('host')==='1';
}
function writeHash(){
  const h=new URLSearchParams();
  if(DB) h.set('db',DB); if(ROOM) h.set('room',ROOM);
  if(ME.pid) h.set('pid',ME.pid); if(HOST) h.set('host','1');
  history.replaceState(null,'','#'+h.toString());
}
function shareLink(){
  const h=new URLSearchParams({db:DB,room:ROOM});
  return location.origin+location.pathname+'#'+h.toString();
}

/* ===================== RENDER HELPERS ===================== */
const el = document.getElementById('app');
function h(html){ el.innerHTML=html; }
function esc(s){ return String(s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }
function playersArr(){
  const p=(room&&room.players)||{};
  return Object.keys(p).map(k=>({pid:k,...p[k]})).sort((a,b)=>(a.joined||0)-(b.joined||0));
}
const alive = () => playersArr().filter(p=>p.alive!==false);
const meP   = () => playersArr().find(p=>p.pid===ME.pid);

/* ===================== SCREEN: FIRST RUN ===================== */
function screenStart(){
  if(ROOM && DB && !ME.pid) return screenJoin();
  h(`<div class="card accent">
      <h1 style="font-size:27px">Köy</h1>
      <p class="muted" style="margin:6px 0 0">Herkes kendi telefonundan oynar. Sen odayı kurarsın, arkadaşların linke tıklar.</p>
    </div>
    <div class="card">
      <h2 style="font-size:17px">Bir kereye mahsus kurulum</h2>
      <ol>
        <li>console.firebase.google.com adresine gir, Google hesabınla "Add project" de. İsim ver, Analytics'i kapat, oluştur.</li>
        <li>Soldaki menüden <b>Build → Realtime Database → Create Database</b>. Bölge farketmez. <b>"Start in test mode"</b> seç.</li>
        <li>Açılan sayfanın üstündeki adresi kopyala. Şuna benzer:<br>
            <span class="muted">https://adin-default-rtdb.firebaseio.com</span></li>
        <li>Aşağıya yapıştır. Bir daha sormayacağım.</li>
      </ol>
      <input type="text" id="dbin" placeholder="https://...firebaseio.com" value="${esc(DB)}" autocapitalize="off" autocorrect="off">
      <button class="btn primary full" style="margin-top:10px" onclick="createRoom()">Oda kur</button>
      <div class="err hidden" id="err"></div>
      <p class="muted" style="margin:12px 0 0">Test modu 30 gün sonra kapanır. Kapanırsa Realtime Database → Rules'tan tarihi ileri al.</p>
    </div>
    <button class="btn ghost sm full" onclick="togglePreRules()">Oyun kuralları</button>
    ${preRules?`<div class="card">${RULES_HTML}</div>`:''}`);
}
let preRules=false;
function togglePreRules(){ preRules=!preRules; screenStart(); }
async function createRoom(){
  const v=document.getElementById('dbin').value.trim();
  if(!/^https:\/\/.+/.test(v)) return fail('Adres https:// ile başlamalı.');
  DB=v.replace(/\/$/,''); ROOM=rid(4); HOST=true; ME.pid='host';
  try{
    await api('/rooms/'+ROOM,'PUT',{meta:{phase:'lobby',day:0,preset:'ilk',created:Date.now()}});
  }catch(e){ return fail('Veritabanına yazılamadı. Adresi ve test modunu kontrol et.'); }
  writeHash(); startPolling();
}
function fail(m){ const e=document.getElementById('err'); if(e){e.textContent=m;e.classList.remove('hidden');} }

/* ===================== SCREEN: JOIN ===================== */
function screenJoin(){
  h(`<div class="card accent">
      <p class="muted" style="margin:0 0 4px">Oda</p>
      <div class="code">${esc(ROOM)}</div>
    </div>
    <div class="card">
      <h2 style="font-size:17px">Adın ne?</h2>
      <p class="muted" style="margin:4px 0 10px">Masadaki herkesin seni tanıdığı isim olsun.</p>
      <input type="text" id="nm" placeholder="Adın" maxlength="18">
      <button class="btn primary full" style="margin-top:10px" onclick="joinRoom()">Katıl</button>
      <div class="err hidden" id="err"></div>
    </div>`);
  setTimeout(()=>{const n=document.getElementById('nm'); n&&n.focus();},100);
}
async function joinRoom(){
  const nm=document.getElementById('nm').value.trim();
  if(nm.length<2) return fail('Adını yaz.');
  const pid=rid(6);
  try{ await api('/rooms/'+ROOM+'/players/'+pid,'PUT',{name:nm,alive:true,joined:Date.now()}); }
  catch(e){ return fail('Odaya bağlanılamadı. Linki tekrar aç.'); }
  ME.pid=pid; ME.name=nm; writeHash(); startPolling();
}

/* ===================== POLLING ===================== */
function startPolling(){
  clearInterval(poll);
  tick(); poll=setInterval(tick, 1600);
}
async function tick(){
  if(busy) return;
  try{
    const data = await api('/rooms/'+ROOM);
    if(!data) return;
    room = data; draw();
  }catch(e){ /* geçici kopma, bir sonraki turda tekrar dene */ }
}

/* ===================== DRAW ===================== */
let lastKey='';
function draw(){
  const k = j(room)+'|'+showRoles+'|'+ME.pid;
  if(k===lastKey) return;
  lastKey=k;
  const m=room.meta||{};
  if(HOST) return drawHost(m);
  drawPlayer(m);
}

/* ---------- HOST ---------- */
function drawHost(m){
  if(m.phase==='lobby')  return hostLobby();
  if(m.phase==='night')  return hostNight(m);
  if(m.phase==='day')    return hostDay(m);
  if(m.phase==='over')   return hostOver(m);
}
function hostLobby(){
  const ps=playersArr(), n=ps.length;
  const pre=(room.meta.preset)||'ilk';
  const plan=buildPlan(n,pre);
  h(`<div class="card accent">
      <p class="muted" style="margin:0 0 4px">Bu linki gruba at</p>
      <div class="code">${esc(ROOM)}</div>
      <button class="btn sm full" style="margin-top:12px" onclick="copyLink()">Linki kopyala</button>
      <p class="muted" id="copied" style="margin:8px 0 0"></p>
    </div>
    <div class="card">
      <div class="row"><h2 style="font-size:17px">Katılanlar</h2><span class="spacer"></span>
        <span class="muted">${n} kişi</span></div>
      <div class="plist" style="margin-top:10px">
        ${ps.map(p=>`<div class="p"><b>${esc(p.name)}</b><small>hazır</small></div>`).join('')
          || '<p class="muted">Henüz kimse katılmadı.</p>'}
      </div>
    </div>
    <div class="card">
      <h2 style="font-size:17px">Set</h2>
      <div class="row wrapr" style="margin:10px 0">
        ${Object.keys(PRESETS).map(k=>`<button class="btn sm ${k===pre?'primary':''}"
           onclick="setPreset('${k}')">${PRESETS[k].label}</button>`).join('')}
      </div>
      ${n<5?'<p class="muted">En az 5 kişi gerekiyor.</p>':`
        <div class="rolerow"><div class="emb s" style="color:var(--madder)">${EMB.gulyabani}</div>
          <div class="tx"><b>Gulyabani <span class="muted" style="font-weight:400">× ${plan.bad}</span></b>
          <span class="muted">${ROLES.gulyabani.d}</span></div></div>
        ${Object.keys(plan.fixed).map(k=>`<div class="rolerow">
          <div class="emb s" style="color:${TEAMCOL[ROLES[k].t]}">${EMB[k]||''}</div>
          <div class="tx"><b>${ROLES[k].n} <span class="muted" style="font-weight:400">× ${plan.fixed[k]}</span></b>
          <span class="muted">${ROLES[k].d}</span></div></div>`).join('')}
        <div class="rolerow"><div class="emb s" style="color:var(--sage)">${EMB.dost}</div>
          <div class="tx"><b>Dost <span class="muted" style="font-weight:400">× ${plan.plain}</span></b>
          <span class="muted">${ROLES.dost.d}</span></div></div>`}
    </div>
    <button class="btn primary full" ${n<5?'disabled':''} onclick="dealRoles()">Rolleri dağıt ve başlat</button>
    <button class="btn ghost sm full" style="margin-top:10px" onclick="toggleRules()">Oyun kuralları</button>
    ${rulesCard()}`);
}
function buildPlan(n,preKey){
  const pre=PRESETS[preKey]||PRESETS.ilk;
  const bad=Math.max(1,Math.round(n*pre.badRate));
  const fixed={};
  let used=bad;
  for(const k in pre.fixed){ if(used+pre.fixed[k]<=n-1){ fixed[k]=pre.fixed[k]; used+=pre.fixed[k]; } }
  const plain=Math.max(0,n-used);
  return {bad,fixed,plain,specials:used-bad,filler:pre.filler};
}
function setPreset(k){ api('/rooms/'+ROOM+'/meta/preset','PUT',k).then(tick); }
function copyLink(){
  const t=shareLink();
  navigator.clipboard?.writeText(t).then(
    ()=>{document.getElementById('copied').textContent='Kopyalandı. WhatsApp grubuna yapıştır.';},
    ()=>{document.getElementById('copied').textContent=t;});
}
async function dealRoles(){
  busy=true;
  const ps=playersArr(), plan=buildPlan(ps.length,room.meta.preset||'ilk');
  const pool=[];
  for(let i=0;i<plan.bad;i++) pool.push('gulyabani');
  for(const k in plan.fixed) for(let i=0;i<plan.fixed[k];i++) pool.push(k);
  for(let i=0;i<plan.plain;i++) pool.push(plan.filler);
  while(pool.length<ps.length) pool.push(plan.filler);
  for(let i=pool.length-1;i>0;i--){const k=(Math.random()*(i+1))|0;[pool[i],pool[k]]=[pool[k],pool[i]];}
  const upd={};
  ps.forEach((p,i)=>{ upd[p.pid+'/role']=pool[i]; upd[p.pid+'/alive']=true; });
  await api('/rooms/'+ROOM+'/players','PATCH',upd);
  await api('/rooms/'+ROOM+'/meta','PATCH',{phase:'night',day:1});
  busy=false; tick();
}

async function resolveNight(){
  busy=true;
  const d=room.meta.day, acts=(room.actions&&room.actions[d])||{};
  const ps=playersArr(), by={}; ps.forEach(p=>by[p.pid]=p);
  const blocked=new Set(), healed=new Set(), guarded=new Set(), guardOf={}, visits={};

  // Gulyabaniler tek hedefte buluşur: en çok oy alan.
  const badVotes={};
  for(const pid in acts){
    const p=by[pid]; if(!p||!ROLES[p.role]) continue;
    const t=acts[pid].target; if(!t) continue;
    (visits[t]=visits[t]||[]).push(pid);
    if(p.role==='gulyabani') badVotes[t]=(badVotes[t]||0)+1;
  }
  let badTarget=null,best=0;
  for(const t in badVotes) if(badVotes[t]>best){best=badVotes[t];badTarget=t;}

  for(const pid in acts){
    const p=by[pid]; if(!p||!ROLES[p.role]) continue;
    const a=ROLES[p.role].act, t=acts[pid].target;
    if(a==='heal'&&t) healed.add(t);
    if(a==='guard'&&t){ guarded.add(t); guardOf[t]=pid; }
    if(a==='vest') healed.add(pid);
  }
  const kills=[];
  if(badTarget) kills.push({from:null,to:badTarget});
  for(const pid in acts){
    const p=by[pid]; if(!p||!ROLES[p.role]) continue;
    if(ROLES[p.role].act!=='kill'||p.role==='gulyabani') continue;
    if(acts[pid].target) kills.push({from:pid,to:acts[pid].target});
  }
  const dead=new Set(), saved=new Set();
  kills.forEach(k=>{
    if(blocked.has(k.from)) return;
    if(healed.has(k.to)){ saved.add(k.to); return; }
    if(guarded.has(k.to)){
      saved.add(k.to);
      if(k.from) dead.add(k.from);
      const g=guardOf[k.to]; if(g) dead.add(g); // Koruma bedeli: hedef kurtulur ama koruyan da ölür
      return;
    }
    dead.add(k.to);
  });

  // Avcı vicdanı: gerçekten bir masumu öldürdüyse kendisi de ölür
  kills.forEach(k=>{
    if(!k.from) return;
    const shooter=by[k.from];
    if(!shooter||shooter.role!=='avci'||!dead.has(k.to)) return;
    const victim=by[k.to];
    if(victim&&ROLES[victim.role]&&ROLES[victim.role].t!=='bad') dead.add(k.from);
  });

  const upd={};
  dead.forEach(pid=>{ upd[pid+'/alive']=false; });
  if(Object.keys(upd).length) await api('/rooms/'+ROOM+'/players','PATCH',upd);

  // Herkesin kendi sonucu: bekçi/gözcü ne öğrendi
  const info={};
  for(const pid in acts){
    const p=by[pid]; if(!p||!ROLES[p.role]) continue;
    const a=ROLES[p.role].act, t=acts[pid].target;
    if(a==='check'&&t) info[pid]= by[t].role==='gulyabani'
        ? esc(by[t].name)+' GULYABANİ.' : esc(by[t].name)+' temiz görünüyor.';
    if(a==='watch'&&t){
      const v=(visits[t]||[]).filter(x=>x!==pid).map(x=>by[x].name);
      info[pid]= v.length? esc(by[t].name)+' şu kişilerce ziyaret edildi: '+v.map(esc).join(', ')
                         : esc(by[t].name)+'—kimse uğramadı.';
    }
    if(a==='vest') info[pid]='Saklandın. Bu gece sana bir şey olmadı.';
  }
  await api('/rooms/'+ROOM+'/results/'+d,'PUT',{
    dead:[...dead].map(pid=>({name:by[pid].name,role:by[pid].role})),
    saved:[...saved].length, info
  });
  await api('/rooms/'+ROOM+'/meta','PATCH',{phase:'day'});
  busy=false; tick();
}

function checkWin(){
  if(room.meta&&room.meta.jesterWin) return 'Şakacı kazandı (asıldığı için).';
  const a=alive();
  const bad=a.filter(p=>ROLES[p.role]&&ROLES[p.role].t==='bad').length;
  const good=a.filter(p=>ROLES[p.role]&&ROLES[p.role].t==='good').length;
  const survivors=a.filter(p=>p.role==='hayatta');
  const note=survivors.length?' (Hayatta Kalan da kazandı: '+survivors.map(p=>esc(p.name)).join(', ')+')':'';
  if(bad===0&&good>0) return 'Dostlar kazandı.'+note;
  if(bad>=good&&bad>0) return 'Gulyabaniler kazandı.'+note;
  if(bad===0&&good===0){
    const killer=a.find(p=>p.role==='serikatil');
    if(killer) return 'Seri Katil kazandı.'+note;
  }
  return null;
}

      ${playersArr().map(p=>`<div class="p ${p.alive===false?'dead':''}"><b>${esc(p.name)}</b>
        <small>${p.alive===false?(ROLES[p.role]?ROLES[p.role].n:'ölü'):'hayatta'}</small></div>`).join('')}
    </div></div>`);
}
function playerOver(me){
  h(`<div class="card accent"><h1 style="font-size:26px">Oyun bitti</h1>
      <p class="muted" style="margin:6px 0 0">${checkWin()||''}</p></div>
    <div class="card"><div class="plist">
      ${playersArr().map(p=>`<div class="p ${p.alive===false?'dead':''}"><b>${esc(p.name)}</b>
        <small>${ROLES[p.role]?ROLES[p.role].n:'—'}</small></div>`).join('')}
    </div></div>
    <button class="btn ghost sm full" onclick="toggleRules()">Oyun kuralları</button>
    ${rulesCard()}`);
}

readHash();
if(DB&&ROOM&&ME.pid) startPolling();
else if(DB&&ROOM) screenJoin();
else screenStart();
</script>
